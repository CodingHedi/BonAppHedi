spring:
  application:
    name: bonapphedi

  # Secrets live here, not in this file. Optional on purpose: the app has to run
  # from a fresh checkout with no credentials at all, and the only difference is
  # that no sign-in button appears. See application-local.yml.example.
  config:
    import: optional:classpath:application-local.yml

  datasource:
    # foreign_keys=on is load-bearing, not decoration. SQLite disables foreign
    # keys per connection by default, and without this every ON DELETE CASCADE
    # in the schema is silently inert (ADR 0002).
    url: jdbc:sqlite:file:${BAH_DB:./data/bonapphedi.db}?foreign_keys=on&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite takes one writer at a time. A large pool buys nothing and turns
      # lock contention into a thundering herd.
      maximum-pool-size: 4
      pool-name: bah-sqlite

  flyway:
    enabled: true
    locations: classpath:db/migration
    # SQLite has no ALTER COLUMN, so migrations are additive from V1 onward and
    # a baseline is never rewritten.
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: always

  session:
    jdbc:
      # Spring Session has no SQLite script to run, so its tables are created by
      # Flyway in V3 instead. Left on, this fails the context with an unresolved
      # schema-@@platform@@.sql rather than creating anything.
      initialize-schema: never
    # Long enough that signing in is a thing you do once. There is nothing behind
    # a session but the right to leave a comment.
    timeout: 30d

bah:
  # Deliberately not spring.security.oauth2.client.registration.*: Spring rejects
  # a blank client-id at startup, which would make an unset environment variable
  # a boot failure instead of "sign-in is off" (ADR 0003). Blank here means the
  # provider is skipped, and zero providers is a supported state.
  oauth:
    google:
      client-id: ${BAH_GOOGLE_CLIENT_ID:}
      client-secret: ${BAH_GOOGLE_CLIENT_SECRET:}
    facebook:
      client-id: ${BAH_FACEBOOK_CLIENT_ID:}
      client-secret: ${BAH_FACEBOOK_CLIENT_SECRET:}
  admin:
    # Comma-separated. Checked on every login, so removing an address here
    # demotes that account the next time it signs in.
    emails: ${BAH_ADMIN_EMAILS:}

  security:
    # Salts the HMAC that identifies a visitor's network address without storing
    # it. Blank means a random salt is generated at startup and a warning is
    # logged: dedupe still works, but only until the next restart, since every
    # stored fingerprint becomes unmatchable when the salt changes.
    fingerprint-salt: ${BAH_FINGERPRINT_SALT:}

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    org.springframework.jdbc.core: info
