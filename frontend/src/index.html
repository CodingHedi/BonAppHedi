<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Bon App' Hédi</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Un carnet de recettes tenu à la main." />
    <meta name="theme-color" content="#f8f5f4" />
    <!--
      Order matters and is the whole mechanism: a browser that understands SVG
      icons takes the first line and never asks for the .ico, and one that does
      not ignores it and falls back to the second. Only the SVG adapts to the
      browser's light/dark setting — the .ico is a single static image and
      cannot.
    -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
      How a reader finds the feeds. Both are declared rather than only the
      French one: a reader on an English page that is offered the French feed
      has been offered the wrong thing, and there is no negotiation step in
      which it could find out.

      Served by FeedController, so they answer in the deployed jar and 404
      under `ng serve` - which is correct rather than unfortunate. Nothing in
      the app requests them, so no suite is misled by their absence.
    -->
    <link rel="alternate" type="application/rss+xml" hreflang="fr" title="Bon App' Hédi" href="/fr/rss.xml" />
    <link rel="alternate" type="application/rss+xml" hreflang="en" title="Bon App' Hédi" href="/en/rss.xml" />

    <!--
      Blocking, and deliberately placed before the stylesheet.

      Without this the page paints in light mode and then snaps to dark once
      Angular boots, which is the most noticeable polish bug a themed site can
      ship. Reading localStorage here costs well under a millisecond.

      It also sets <html lang> from the URL prefix so assistive tech and search
      engines get the right language before any framework loads.

      The storage key is inherited from the design prototype so an existing
      preference survives.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('bah-organic-theme');
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.setAttribute('data-theme', dark ? 'dark' : 'light');

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#241f1a' : '#f8f5f4');

          var seg = location.pathname.split('/')[1];
          root.setAttribute('lang', seg === 'en' ? 'en' : 'fr');
        } catch (e) {
          /* private mode or storage disabled: fall through to the defaults above */
        }
      })();
    </script>
  </head>
  <body>
    <bah-root></bah-root>
  </body>
</html>
