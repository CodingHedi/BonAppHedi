<svg xmlns="http://www.w3.org/2000/svg" viewBox="-35.1 -43.15 450.09 450.09" role="img" aria-label="Bon App' Hédi">
  <title>Bon App' Hédi</title>
  <!--
    The pot alone, cropped square out of the lockup.

    The viewBox is the mark's own bounding box (0, 2.61, 379.88 × 358.56)
    squared off on its longer side and inset by the proof sheet's 7.8%
    breathing room, centred. Those numbers are measured rather than eyeballed —
    a favicon that touches its own edges reads as clipped at 16px.

    Ink on light chrome, Cream on dark. This is the one place the mark is NOT
    Orange: a favicon sits on browser chrome rather than on a site surface, so
    it is judged against a tab strip, and the pair chosen on the proof sheet's
    favicon bench is the one that survives both. The header lockup keeps Orange
    (`A·C·A` / `A·I·A`) — the two are answering different questions.

    `prefers-color-scheme` inside an SVG favicon follows the browser's own
    setting, which is what makes this adapt without any script. It is inert in
    a browser that does not support SVG icons; those fall back to favicon.ico.
  -->
  <style>
    path { fill: #1e1a1b; }
    @media (prefers-color-scheme: dark) {
      path { fill: #efe6d6; }
    }
  </style>
